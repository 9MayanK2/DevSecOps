##################################################
# Hadolint Policy
##################################################

HADOLINT_ENABLED=true

HADOLINT_FAIL_ON_ERROR=true

HADOLINT_FAIL_ON_WARNING=false

HADOLINT_FAIL_ON_INFO=false

##################################################
# Gitleaks Policy
##################################################

GITLEAKS_ENABLED=true

GITLEAKS_FAIL_ON_ERROR=true


##################################################
# Report Policy
##################################################

GENERATE_JSON_REPORT=true

GENERATE_TEXT_REPORT=true

SAVE_SCAN_HISTORY=true

##################################################
# Logging
##################################################

ENABLE_LOGGING=true

LOG_LEVEL=INFO

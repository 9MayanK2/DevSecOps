apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: sentinelops

  labels:
    app: frontend

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: 284064534086.dkr.ecr.us-east-1.amazonaws.com/sentinelops-frontend:1

          imagePullPolicy: Always

          ports:

            - containerPort: 8080

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:

            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:

            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 10
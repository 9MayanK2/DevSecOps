apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: sentinelops

  labels:
    app: backend

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: 284064534086.dkr.ecr.us-east-1.amazonaws.com/sentinelops-backend:1

          imagePullPolicy: Always

          ports:

            - containerPort: 5000

          envFrom:

            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

          resources:

            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 30
            periodSeconds: 15
grafana:

  enabled: true

  adminUser: admin

  adminPassword: SentinelOps@123

  persistence:

    enabled: true

    storageClassName: gp2

    accessModes:
      - ReadWriteOnce

    size: 10Gi

  service:

    type: ClusterIP

prometheus:

  enabled: true

  prometheusSpec:

    retention: 15d

    scrapeInterval: 30s

    evaluationInterval: 30s

    storageSpec:

      volumeClaimTemplate:

        spec:

          storageClassName: gp2

          accessModes:
            - ReadWriteOnce

          resources:

            requests:
              storage: 20Gi

    resources:

      requests:

        cpu: 500m

        memory: 1Gi

      limits:

        cpu: 1

        memory: 2Gi

alertmanager:

  enabled: true

  alertmanagerSpec:

    storage:

      volumeClaimTemplate:

        spec:

          storageClassName: gp2

          accessModes:
            - ReadWriteOnce

          resources:

            requests:

              storage: 5Gi

nodeExporter:

  enabled: true

kubeStateMetrics:

  enabled: true

prometheusOperator:

  enabled: true